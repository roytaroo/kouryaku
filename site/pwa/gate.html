<div class="gate" id="gate">
  <div class="gate-in">
    <div class="gate-logo">攻</div>
    <div class="brand">攻略<small>受験編</small></div>
    <p class="note" id="gateMsg">読み込み中…</p>
    <form id="gateForm" hidden>
      <input class="field" id="gEmail" type="email" autocomplete="username" placeholder="メールアドレス" required>
      <input class="field" id="gPass" type="password" autocomplete="current-password" placeholder="パスワード" required>
      <button class="big-btn" type="submit">ログイン</button>
    </form>
  </div>
</div>
